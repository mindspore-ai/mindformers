checkpoint:
  enable_save: False
  save_path: "./output/checkpoint"
  remove_redundancy: True

  load_path: ""
  load_balanced: False
  no_load_optim: True
  load_worker_number: 1

training: # name refers to torchtitan
  steps: 300 # total number of training steps
  local_batch_size: 1 # per-rank batch size (corresponds to runner_config: batch_size)
  global_batch_size: 16 # total number of samples processed per step across all ranks
  deterministic: True # enable deterministic training behavior

# optimizer
optimizer:
  type: Muon
  weight_decay: 0.1
  matched_adamw_rms: 0.2
  momentum: 0.95
  nesterov: True
  adamw_betas:
  - 0.9
  - 0.95
  adamw_eps: 1.e-8
  qk_clip_enabled: True
  qk_clip_threshold: 100
  ns_coefficients: [[[3.4445, -4.7750, 2.0315 ], 8], [[2.0, -1.5, 0.5], 2]]
  comm_strategy: allgather_deredundency
  use_fused_adamw: true

lr_scheduler:
  type: ConstantWarmUpLR
  learning_rate: 1.e-5
  lr_end: 1.e-5
  warmup_lr_init: 0
  warmup_steps: 0
  total_steps: -1

parallelism: # name refers to torchtitan
  # -- Data Parallel / FSDP / HSDP --
  data_parallel_shard: -1                 # The only DP field users need to configure; -1 means all remaining cards are sharded (pure FSDP)
  reshard_after_forward_policy: "default" # Whether to reshare parameters after forward pass: always / never / default
  cpu_offload: False                      # Offload sharded parameters/gradients to CPU
  disable_gradient_division: True         # Disable FSDP automatic gradient averaging (aggregate by sum)

  # -- Tensor Parallel (TP) --
  tensor_parallel: 1

  # -- Context Parallel (CP) --
  context_parallel: 1
  context_parallel_method: "colossal"     # colossal / ulysses / hybrid
  context_parallel_async: False
  ulysses_degree_in_cp: null              # Value determined by rules when using ulysses/hybrid
  context_parallel_mask_type: "causal"

  # -- Pipeline Parallel (PP) --
  pipeline_parallel: 1
  pipeline_parallel_interleave_num: 1     # Number of interleaved model blocks per stage
  pipeline_parallel_layers_per_stage: null   # Required when pp>1: auto (equal split) or list of layer intervals per stage, see 4.4
  pipeline_parallel_overlap_p2p: False
  pipeline_parallel_overlap_b_f: False

  # -- Expert Parallel (EP) for MoE --
  expert_parallel: 8
  moe_token_dispatcher_type: "alltoall"   # alltoall / alltoall_deredundancy

recompute:
  mode: full
  full_recompute_layer: [0-2]            # Updated for 61 layers (Pro)

train_dataset: &train_dataset
  dataloader:
    type: BlendedMegatronDatasetDataLoader
    datasets_type: "GPTDataset"
    sizes:
      - 16000 # Number of training dataset samples
      - 0    # Number of test dataset samples, currently not supported
      - 0    # Number of eval dataset samples, currently not supported
    config:  # GPTDataset configuration
      seed: 1234                         # Random seed for data sampling
      split: "1, 0, 0"                   # Split ratio for train/test/eval, currently not supported
      seq_length: &seq_length 4096       # Sequence length of returned data
      eod_mask_loss: &eod False              # Whether to compute loss at EOD
      reset_position_ids: *eod          # Whether to reset position_ids at EOD
      create_attention_mask: False       # Whether to return attention_mask
      reset_attention_mask: *eod        # Whether to reset attention_mask at EOD, returning stepped attention_mask
      create_compressed_eod_mask: *eod  # Whether to return compressed attention_mask
      eod_pad_length: 128                # Set length of compressed attention_mask
      eod: 1                             # EOD token id in dataset
      pad: -1                            # PAD token id in dataset
      data_path: # Megatron dataset sampling ratio and path.
        - '1'
        - "/path/megatron_dataset/wiki103-megatron_text_document"
    column_names: ["input_ids", "labels", "loss_mask", "position_ids"]

model:
  model_type: deepseek_v4
  architectures: DeepseekV4ForCausalLM
  offset: 0
  pad_token_id: -1

  vocab_size: 129280
  seq_length: *seq_length
  hidden_size: 4096 #7168
  num_hidden_layers: 3 #61
  max_position_embeddings: 1048576
  hidden_act: 'silu'
  num_attention_heads: 128
  rms_norm_eps: 1.0e-6
  add_bias_linear: False
  use_flash_attention: True
  use_attn_mask_compression: True
  activation_func_clamp_value: 10.0

  multi_latent_attention: True
  mla_qkv_concat: True
  o_groups: 16
  o_lora_rank: 1024
  q_lora_rank: 1536
  qk_rope_head_dim: 64
  qk_nope_head_dim: 448
  qk_layernorm: True
  v_head_dim: 512

  attention_dropout: 0.0
  hidden_dropout: 0.0

  params_dtype: "bfloat16"
  compute_dtype: "bfloat16"
  layernorm_compute_dtype: "float32"
  softmax_compute_dtype: "float32"
  rotary_dtype: "float32"
  initializer_range: 0.02

  num_nextn_predict_layers: 1
  mtp_loss_factor: 0.3

  position_embedding_type: "yarn"
  rotary_scaling_factor: 16
  beta_fast: 32
  beta_slow: 1
  mscale: 1
  mscale_all_dim: 1
  rope_theta: 10000.0

  # moe config
  moe_router_dtype: "float32"
  gated_linear_unit: True
  moe_intermediate_size: 3072
  routed_scaling_factor: 2.5
  num_hash_layers: 3
  n_routed_experts: 64 #384
  num_experts_per_tok: 6
  n_shared_experts: 1
  moe_router_group_topk: 0
  n_group: 0
  moe_shared_expert_intermediate_size: 2048
  norm_topk_prob: True
  moe_router_score_function: 'sqrtsoftplus'
  moe_grouped_gemm: True
  use_pad_tokens: False

  moe_router_load_balancing_type: 'seq_aux_loss'
  moe_aux_loss_coeff: 0.0001

  moe_token_drop_policy: False
  moe_router_enable_expert_bias: True
  moe_router_bias_update_rate: 0.0001
  moe_router_force_expert_balance: False

  # mhc config
  enable_hyper_connections: True
  num_residual_streams: 4
  mhc_sinkhorn_iterations: 20
  mhc_init_gating_factor: 0.01

  # dsa config (indexer)
  index_n_heads: 64
  index_head_dim: 128
  index_topk: 1024
  dsa_indexer_loss_coeff: 1.0
  dsa_indexer_use_sparse_loss: True

  # csa config
  experimental_attention_variant: dsv4_hybrid
  compress_ratios: [0, 4, 128, 0]
  csa_window_size: 128
  compress_rope_theta: 160000
  csa_dense_mode: False
  apply_dsa_kernel_fusion: False