checkpoint:
  enable_save: true
  save_path: ./output/checkpoint
  save_max: 1
  save_interleaved_steps: 3
  no_save_optim: false
  async_save: false
  prefix: custom
  remove_redundancy: false
  load_path: ''
  load_balanced: false
  no_load_optim: true
  load_worker_number: 1
training:
  steps: 4000
  local_batch_size: 1
  global_batch_size: 64
  max_norm: 1.0
  seed: 42
  deterministic: false
optimizer:
  type: Muon
  adamw_betas:
  - 0.9
  - 0.95
  adamw_eps: 1.0e-08
  weight_decay: 0.1
  matched_adamw_rms: 0.2
  momentum: 0.95
  nesterov: true
  ns_steps: 5
  qk_clip_threshold: 100
  qk_clip_enabled: true
  comm_strategy: allgather_deredundency
  use_fused_adamw: true
lr_scheduler:
  type: ConstantWarmUpLR
  learning_rate: 3.0e-05
  warmup_lr_init: 0
  warmup_steps: 0
  total_steps: 4000
callbacks: []
parallelism:
  data_parallel_shard: -1
  data_parallel_shard_strategy: optim_grads_params
  tensor_parallel: 1
  context_parallel: 4
  context_parallel_method: colossal
  pipeline_parallel: 1
  pipeline_parallel_schedule: 1f1b
  pipeline_parallel_microbatch_size: 1
  pipeline_parallel_interleave_num: 1
  pipeline_parallel_layers_per_stage: null
  sequence_parallel: true
  expert_parallel: 1
recompute:
  mode: full
  full_recompute_layer:
  - 0-44
train_dataset:
  dataloader:
    type: OrderedIndexDataLoader
    data_path: /path/to/xing4_285b_dataset
    shuffle: false
    sequence_length: 4096
    reset_position_ids: false
    eod_mask_loss: false
    create_attention_mask: false
    reset_attention_mask: false
    create_compressed_eod_mask: true
    compressed_eod_mask_length: 128
    eod_token: 1
    pad_token: 2
    create_seq_len_vector: false
    column_names:
    - input_ids
    - labels
    - loss_mask
    - position_ids
    - actual_seq_len
    python_multiprocessing: false
    use_cache: true
    cache_dir: ./output/dataset_cache
  drop_remainder: true
  num_parallel_workers: 16
  prefetch_size: 1
  numa_enable: false
model:
  chunk_loss_num: 8
  calculate_per_token_loss: false
  model_type: xing4_v41
  architectures: Xing4ForCausalLM
  vocab_size: 131072
  seq_length: 4096
  hidden_size: 4096
  intermediate_size: 18432
  num_hidden_layers: 45
  max_position_embeddings: 1048576
  hidden_act: silu
  num_attention_heads: 128
  num_key_value_heads: 128
  bos_token_id: 0
  eos_token_id: 1
  pad_token_id: 2
  rms_norm_eps: 1.0e-05
  add_bias_linear: false
  attention_bias: false
  use_flash_attention: true
  use_eod_attn_mask_compression: true
  use_attn_mask_compression: true
  multi_latent_attention: true
  mla_qkv_concat: true
  kv_lora_rank: 512
  q_lora_rank: 1536
  qk_rope_head_dim: 64
  v_head_dim: 128
  qk_nope_head_dim: 128
  qk_layernorm: true
  attention_dropout: 0.0
  hidden_dropout: 0.0
  params_dtype: bfloat16
  embedding_params_dtype: bfloat16
  compute_dtype: bfloat16
  layernorm_compute_dtype: float32
  softmax_compute_dtype: float32
  rotary_dtype: float32
  fp32_residual_connection: true
  initializer_range: 0.0048
  num_nextn_predict_layers: 0
  mtp_loss_scaling_factor: 0.1
  mtp_enable_hyper_connections: false
  position_embedding_type: yarn
  rotary_scaling_factor: 32
  beta_fast: 32
  beta_slow: 1
  mscale: 1
  mscale_all_dim: 1
  rope_theta: 100000.0
  rope_scaling:
    type: yarn
    factor: 32.0
    original_max_position_embeddings: 32768
    beta_fast: 32
    beta_slow: 1
    mscale: 1.0
    mscale_all_dim: 1.0
  apply_rope_fusion: true
  bias_swiglu_fusion: false
  experimental_attention_variant: dsa
  enable_hyper_connections: false
  enable_hc_head: false
  gated_linear_unit: true
  moe_intermediate_size: 2048
  routed_scaling_factor: 2.5
  first_k_dense_replace: 3
  n_routed_experts: 256
  num_experts_per_tok: 8
  n_shared_experts: 1
  moe_shared_expert_intermediate_size: 2048
  norm_topk_prob: true
  moe_router_score_function: sigmoid
  moe_grouped_gemm: true
  moe_permute_fusion: true
  topk_group: 1
  n_group: 1
  moe_z_loss_coeff: 0.0
  use_pad_tokens: true
  moe_router_force_expert_balance: false
  moe_router_load_balancing_type: seq_aux_loss
  moe_aux_loss_coeff: 0.0005
  moe_token_drop_policy: false
  moe_router_enable_expert_bias: true
  moe_router_bias_update_rate: 0.0001
  moe_n_hash_layers: 0
  activation_func_clamp_value: null
  moe_router_dtype: float32
  index_n_heads: 64
  index_head_dim: 128
  index_topk: 2048
  dsa_indexer_topk_freq: 1
  dsa_indexer_loss_coeff: 1.0
  dsa_indexer_use_sparse_loss: true
  dsa_indexer_layerwise_backward: true
  mtp_enable_dsa: false
context:
  mode: 1
  device_target: Ascend
